<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEX — المتابعة الأسبوعية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050814;
    --surface:#0A0F22;
    --surface-2:#101830;
    --border:#1E2A47;
    --primary:#378ADD;
    --primary-dark:#2A6DB0;
    --accent:#2FD6C6;
    --white:#FFFFFF;
    --gray:#9CA3AF;
    --gray-dim:#6B7280;
    --danger:#E5484D;
    --radius:14px;
    --font-ar-display: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    --font-ar-body: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    --font-num: 'Bebas Neue', 'Oswald', 'Cairo', sans-serif;
    --font-en: 'Oswald', 'Cairo', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:var(--font-ar-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-inline:16px;
    padding-block:28px 60px;
  }
  img{max-width:100%;}
  [hidden]{display:none !important;}
  a{color:var(--primary);}

  .wrap{max-width:520px;margin:0 auto;}
  .wrap.wide{max-width:920px;}

  .brand{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    margin-bottom:28px;text-align:center;
  }
  .brand img{width:88px;height:auto;display:block;}
  .brand .tag{
    font-family:var(--font-en);
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gray);
  }

  h1,h2,h3{font-family:var(--font-ar-display);margin:0;text-wrap:balance;}
  h1{font-size:28px;font-weight:800;}
  h2{font-size:20px;font-weight:800;}
  h3{font-size:16px;font-weight:700;}
  p{line-height:1.7;color:var(--gray);margin:0;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
  }
  .stack{display:flex;flex-direction:column;gap:16px;}
  .stack-sm{display:flex;flex-direction:column;gap:8px;}

  .field-label{font-weight:700;font-size:15px;color:var(--white);}
  .field-hint{font-size:13px;color:var(--gray-dim);}

  input[type="text"],input[type="number"],textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--white);
    border-radius:10px;
    padding:13px 14px;
    font-family:var(--font-ar-body);
    font-size:16px;
    outline:none;
    transition:border-color .15s ease;
  }
  input[type="number"]{direction:ltr;text-align:right;font-variant-numeric:tabular-nums;}
  textarea{resize:vertical;min-height:78px;font-size:15px;}
  input:focus,textarea:focus{border-color:var(--primary);}
  .input-suffix-row{position:relative;}
  .input-suffix{
    position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);
    color:var(--gray-dim);font-size:13px;font-family:var(--font-en);pointer-events:none;
  }
  .input-suffix-row input{padding-inline-start:52px;}

  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .scale button{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--gray);
    border-radius:10px;
    padding:12px 0;
    font-family:var(--font-num);
    font-size:20px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .scale button.active{
    background:var(--primary);
    border-color:var(--primary);
    color:var(--white);
  }
  .scale-caption{font-size:13px;color:var(--accent);min-height:18px;font-weight:600;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--primary);color:var(--white);border:none;
    border-radius:10px;padding:15px 20px;font-family:var(--font-ar-body);
    font-weight:700;font-size:16px;cursor:pointer;width:100%;
    transition:background .15s ease, transform .1s ease;
  }
  .btn:hover{background:var(--primary-dark);}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-outline{
    background:transparent;border:1px solid var(--border);color:var(--white);
  }
  .btn-outline:hover{background:var(--surface-2);border-color:var(--primary);}
  .btn-sm{width:auto;padding:9px 14px;font-size:14px;border-radius:8px;}
  .btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}

  .error-text{color:var(--danger);font-size:13px;}

  .center-screen{
    min-height:70vh;display:flex;align-items:center;justify-content:center;
  }
  .spinner{
    width:28px;height:28px;border-radius:50%;
    border:3px solid var(--surface-2);border-top-color:var(--primary);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .success-icon{
    width:56px;height:56px;border-radius:50%;
    background:rgba(47,214,198,.12);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 4px;
  }

  .recap{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .recap-item{
    background:var(--surface-2);border-radius:10px;padding:10px 12px;
  }
  .recap-item .k{font-size:12px;color:var(--gray-dim);}
  .recap-item .v{font-family:var(--font-num);font-size:22px;color:var(--white);}

  /* Admin */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-bottom:22px;flex-wrap:wrap;
  }
  .topbar .brand{flex-direction:row;margin:0;text-align:start;}
  .topbar .brand img{width:40px;}

  .section-title{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:14px;
  }

  .client-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;
  }
  .client-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;display:flex;flex-direction:column;gap:10px;
  }
  .client-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .pill{
    font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;
    white-space:nowrap;
  }
  .pill-done{background:rgba(47,214,198,.14);color:var(--accent);}
  .pill-pending{background:var(--surface-2);color:var(--gray-dim);border:1px solid var(--border);}
  .stat-row{display:flex;align-items:baseline;gap:8px;}
  .stat-row .num{font-family:var(--font-num);font-size:30px;line-height:1;}
  .stat-row .delta{font-size:13px;font-family:var(--font-en);}
  .delta-up{color:var(--primary);}
  .delta-down{color:var(--accent);}
  .client-actions{display:flex;gap:8px;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead th{
    text-align:start;color:var(--gray-dim);font-weight:600;font-size:12px;
    text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;
    border-bottom:1px solid var(--border);white-space:nowrap;
  }
  tbody td{
    padding:12px;border-bottom:1px solid var(--border);white-space:nowrap;
    color:var(--white);
  }
  tbody tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);}
  .table-wrap table{border:none;}
  .table-wrap thead th:first-child,.table-wrap tbody td:first-child{padding-inline-start:16px;}

  select{
    background:var(--surface-2);border:1px solid var(--border);color:var(--white);
    border-radius:8px;padding:9px 12px;font-family:var(--font-ar-body);font-size:14px;
  }

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;
  }
  .modal{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px;max-width:400px;width:100%;
  }
  .copy-box{
    background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    padding:10px 12px;font-size:12px;direction:ltr;text-align:left;word-break:break-all;
    color:var(--gray);font-family:monospace;
  }

  @media (max-width:480px){
    .client-grid{grid-template-columns:1fr;}
    h1{font-size:24px;}
  }
</style>
</head>

/* ======================= HELPERS ======================= */
const qs = new URLSearchParams(location.search);
const app = document.getElementById('app');

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

// Plain same-origin fetch — the backend now lives at /api/action on this
// same Vercel deployment, so there's no cross-domain call to Google Apps
// Script anymore (that's what caused the earlier "no connection" issues).
async function api(action, payload){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ action }, payload || {}))
  });
  if (!res.ok) throw { ok:false, error: 'http_' + res.status };
  return await res.json();
}

function weekRangeLabel(){
  const now = new Date();
  const day = now.getDay() === 0 ? 7 : now.getDay(); // 1..7, Mon..Sun
  const monday = new Date(now); monday.setDate(now.getDate() - day + 1);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  const fmt = d => d.toLocaleDateString('ar-EG-u-nu-latn', {day:'numeric', month:'short'});
  return `${fmt(monday)} – ${fmt(sunday)}`;
}

function fmtNum(n){
  if (n === '' || n === null || n === undefined) return '—';
  return n;
}

function showSetupNotice(){
  app.innerHTML = '';
  app.appendChild(el(`
    <div class="wrap center-screen">
      <div class="card stack" style="text-align:center;">
        <img src="${LOGO_SRC}" alt="PEX" style="width:64px;margin:0 auto;">
        <h2>الإعداد لسه مكملش</h2>
        <p>لازم تحط رابط الـ Google Apps Script Web App بتاعك جوه ملف الصفحة (متغير API_URL) الأول عشان الصفحة تشتغل.</p>
      </div>
    </div>
  `));
}

/* ======================= CLIENT VIEW ======================= */
async function renderClientView(token){
  app.innerHTML = '';
  app.appendChild(el(`<div class="wrap center-screen"><div class="spinner"></div></div>`));

  let clientRes, checkinRes;
  try{
    clientRes = await api('getClient', {token});
    if (clientRes.ok) checkinRes = await api('getMyCheckin', {token});
  } catch(err){
    if (err && err.error === 'not_configured') return showSetupNotice();
    return renderConnectionError(() => renderClientView(token));
  }

  if (!clientRes.ok){
    app.innerHTML = '';
    app.appendChild(el(`
      <div class="wrap center-screen">
        <div class="card stack" style="text-align:center;">
          <img src="${LOGO_SRC}" alt="PEX" style="width:64px;margin:0 auto;">
          <h2>اللينك مش شغال</h2>
          <p>الرابط ده مش معروف عندنا. تأكد إنك فاتح نفس اللينك اللي بعتهولك الكوتش، أو كلمه يبعتهولك تاني.</p>
        </div>
      </div>
    `));
    return;
  }

  const name = clientRes.name;
  const existing = checkinRes && checkinRes.exists ? checkinRes : null;

  app.innerHTML = '';
  const wrap = el(`<div class="wrap"></div>`);
  wrap.appendChild(el(`
    <div class="brand">
      <img src="${LOGO_SRC}" alt="PEX">
      <div class="tag">weekly check-in</div>
    </div>
  `));
  wrap.appendChild(el(`
    <div class="stack-sm" style="margin-bottom:20px;text-align:center;">
      <h1>أهلاً ${name}</h1>
      <p>متابعة الأسبوع (${weekRangeLabel()})</p>
    </div>
  `));

  const form = el(`<form class="card stack"></form>`);

  if (existing){
    form.appendChild(el(`<div class="field-hint" style="color:var(--accent);">لقينا متابعة مسجلة للأسبوع ده — تقدر تعدّلها وتبعتها تاني.</div>`));
  }

  // Weight
  form.appendChild(el(`
    <div class="stack-sm">
      <div class="field-label">الوزن الحالي</div>
      <div class="input-suffix-row">
        <span class="input-suffix">كجم</span>
        <input type="number" inputmode="decimal" step="0.1" min="20" max="400" id="f-weight" required value="${existing ? existing.weight : ''}">
      </div>
    </div>
  `));

  // Sleep hours
  form.appendChild(el(`
    <div class="stack-sm">
      <div class="field-label">متوسط ساعات النوم يوميًا</div>
      <div class="field-hint">تقريبًا، آخر أسبوع</div>
      <div class="input-suffix-row">
        <span class="input-suffix">ساعة</span>
        <input type="number" inputmode="decimal" step="0.5" min="0" max="16" id="f-sleep" required value="${existing ? existing.sleepHours : ''}">
      </div>
    </div>
  `));

  // Energy scale
  const energyLabels = ['ضعيف جدًا','أقل من المعتاد','متوسط','كويس','ممتاز'];
  form.appendChild(buildScale('energy', 'مستوى الطاقة العام', energyLabels, existing ? existing.energy : null));

  // Diet scale
  const dietLabels = ['فشلت خالص','التزام ضعيف','التزام متوسط','التزام كويس','التزام كامل'];
  form.appendChild(buildScale('diet', 'الالتزام بالنظام الغذائي', dietLabels, existing ? existing.diet : null));

  // Steps
  form.appendChild(el(`
    <div class="stack-sm">
      <div class="field-label">متوسط عدد الخطوات اليومي</div>
      <input type="number" inputmode="numeric" step="100" min="0" id="f-steps" required value="${existing && existing.steps ? existing.steps : ''}">
    </div>
  `));

  // Problems
  form.appendChild(el(`
    <div class="stack-sm">
      <div class="field-label">أي مشاكل قابلتك الأسبوع ده في التمرين أو الدايت؟</div>
      <textarea id="f-problems" required>${existing ? (existing.problems||'') : ''}</textarea>
    </div>
  `));

  // Notes
  form.appendChild(el(`
    <div class="stack-sm">
      <div class="field-label">ملاحظات إضافية</div>
      <textarea id="f-notes" required>${existing ? (existing.notes||'') : ''}</textarea>
    </div>
  `));

  // Week rating scale
  const ratingLabels = ['أسبوع صعب جدًا','أقل من المتوقع','عادي','كويس','أسبوع ممتاز'];
  form.appendChild(buildScale('weekRating', 'تقييمك للأسبوع', ratingLabels, existing ? existing.weekRating : null));

  const errBox = el(`<div class="error-text" hidden></div>`);
  form.appendChild(errBox);

  const submitBtn = el(`<button type="submit" class="btn">${existing ? 'تحديث المتابعة' : 'إرسال المتابعة'}</button>`);
  form.appendChild(submitBtn);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.hidden = true;
    const weight = form.querySelector('#f-weight').value;
    const sleepHours = form.querySelector('#f-sleep').value;
    const energy = form.querySelector('input[name="energy-val"]').value;
    const diet = form.querySelector('input[name="diet-val"]').value;
    const steps = form.querySelector('#f-steps').value;
    const problems = form.querySelector('#f-problems').value;
    const notes = form.querySelector('#f-notes').value;
    const weekRating = form.querySelector('input[name="weekRating-val"]').value;

    if (!weight || !sleepHours || !energy || !diet || !steps || !problems.trim() || !notes.trim() || !weekRating){
      errBox.textContent = 'من فضلك املأ كل الحقول قبل الإرسال.';
      errBox.hidden = false;
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'جاري الإرسال...';
    try{
      const res = await api('submitCheckin', {
        token, weight: Number(weight), sleepHours: Number(sleepHours),
        energy: Number(energy), diet: Number(diet),
        steps: Number(steps), problems, notes, weekRating: Number(weekRating)
      });
      if (!res.ok) throw res;
      renderClientSuccess(name, {weight, sleepHours, energy, diet, steps, weekRating});
    } catch(err){
      errBox.textContent = 'حصل خطأ في الإرسال. جرب تاني.';
      errBox.hidden = false;
      submitBtn.disabled = false;
      submitBtn.textContent = existing ? 'تحديث المتابعة' : 'إرسال المتابعة';
    }
  });

  wrap.appendChild(form);
  app.appendChild(wrap);
}

function buildScale(name, label, labels, initial){
  const wrapper = el(`
    <div class="stack-sm">
      <div class="field-label">${label}</div>
      <div class="scale" data-scale="${name}"></div>
      <div class="scale-caption"></div>
      <input type="hidden" name="${name}-val" value="${initial || ''}">
    </div>
  `);
  const scaleEl = wrapper.querySelector('.scale');
  const caption = wrapper.querySelector('.scale-caption');
  const hidden = wrapper.querySelector(`input[name="${name}-val"]`);
  for (let i=1;i<=5;i++){
    const b = el(`<button type="button">${i}</button>`);
    if (initial && Number(initial) === i){ b.classList.add('active'); caption.textContent = labels[i-1]; }
    b.addEventListener('click', () => {
      scaleEl.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      hidden.value = i;
      caption.textContent = labels[i-1];
    });
    scaleEl.appendChild(b);
  }
  return wrapper;
}

function renderClientSuccess(name, data){
  app.innerHTML = '';
  const wrap = el(`<div class="wrap"></div>`);
  wrap.appendChild(el(`
    <div class="brand">
      <img src="${LOGO_SRC}" alt="PEX">
    </div>
  `));
  const card = el(`
    <div class="card stack" style="text-align:center;">
      <div class="success-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path d="M4 12.5L9.5 18L20 6" stroke="#2FD6C6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2>تم إرسال متابعتك</h2>
      <p>شكرًا يا ${name} — نشوفك الأسبوع الجاي</p>
    </div>
  `);
  const recap = el(`<div class="recap"></div>`);
  recap.appendChild(el(`<div class="recap-item"><div class="k">الوزن</div><div class="v">${data.weight} كجم</div></div>`));
  recap.appendChild(el(`<div class="recap-item"><div class="k">النوم</div><div class="v">${data.sleepHours} س</div></div>`));
  recap.appendChild(el(`<div class="recap-item"><div class="k">الطاقة</div><div class="v">${data.energy}/5</div></div>`));
  recap.appendChild(el(`<div class="recap-item"><div class="k">الالتزام</div><div class="v">${data.diet}/5</div></div>`));
  recap.appendChild(el(`<div class="recap-item"><div class="k">تقييم الأسبوع</div><div class="v">${data.weekRating}/5</div></div>`));
  card.appendChild(recap);
  wrap.appendChild(card);
  app.appendChild(wrap);
}

function renderConnectionError(retry){
  app.innerHTML = '';
  app.appendChild(el(`
    <div class="wrap center-screen">
      <div class="card stack" style="text-align:center;">
        <h2>مفيش اتصال</h2>
        <p>مش قادرين نوصل للسيرفر دلوقتي. تأكد إنك متصل بالإنترنت وجرب تاني.</p>
        <button class="btn" id="retry-btn">إعادة المحاولة</button>
      </div>
    </div>
  `));
  document.getElementById('retry-btn').addEventListener('click', retry);
}

/* ======================= ADMIN VIEW ======================= */
function getAdminPassword(){ return sessionStorage.getItem('pex_admin_pw') || ''; }
function setAdminPassword(pw){ sessionStorage.setItem('pex_admin_pw', pw); }
function clearAdminPassword(){ sessionStorage.removeItem('pex_admin_pw'); }

async function renderAdminView(){
  const savedPw = getAdminPassword();
  if (savedPw){
    const ok = await tryAdminLogin(savedPw, true);
    if (ok) return renderAdminDashboard(savedPw);
  }
  renderAdminLogin();
}

function renderAdminLogin(errMsg){
  app.innerHTML = '';
  const wrap = el(`<div class="wrap center-screen"></div>`);
  wrap.style.minHeight = '80vh';
  const card = el(`
    <div class="card stack" style="width:100%;max-width:360px;">
      <div class="brand" style="margin:0 0 4px;">
        <img src="${LOGO_SRC}" alt="PEX" style="width:64px;">
      </div>
      <h2 style="text-align:center;">دخول الكوتش</h2>
      <input type="text" id="admin-pw" placeholder="كلمة السر" autocomplete="off" style="direction:ltr;text-align:center;">
      <div class="error-text" id="admin-err" ${errMsg ? '' : 'hidden'}>${errMsg||''}</div>
      <button class="btn" id="admin-login-btn">دخول</button>
    </div>
  `);
  wrap.appendChild(card);
  app.appendChild(wrap);

  const pwInput = card.querySelector('#admin-pw');
  const errBox = card.querySelector('#admin-err');
  const btn = card.querySelector('#admin-login-btn');

  async function doLogin(){
    const pw = pwInput.value;
    if (!pw) return;
    btn.disabled = true; btn.textContent = 'جاري التحقق...';
    try{
      const ok = await tryAdminLogin(pw, false);
      if (ok){ setAdminPassword(pw); renderAdminDashboard(pw); }
      else { errBox.textContent = 'كلمة السر غلط.'; errBox.hidden = false; }
    } catch(err){
      if (err && err.error === 'not_configured') return showSetupNotice();
      errBox.textContent = 'مفيش اتصال بالسيرفر دلوقتي.'; errBox.hidden = false;
    }
    btn.disabled = false; btn.textContent = 'دخول';
  }
  btn.addEventListener('click', doLogin);
  pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

async function tryAdminLogin(pw, silent){
  try{
    const res = await api('adminLogin', {password: pw});
    return !!res.ok;
  } catch(err){
    if (silent) return false;
    throw err;
  }
}

async function renderAdminDashboard(pw){
  app.innerHTML = '';
  app.appendChild(el(`<div class="wrap wide center-screen"><div class="spinner"></div></div>`));

  let clients, checkins;
  try{
    const [cRes, kRes] = await Promise.all([api('listClients',{password:pw}), api('listCheckins',{password:pw})]);
    if (!cRes.ok || !kRes.ok){ clearAdminPassword(); return renderAdminLogin('انتهت الجلسة، ادخل تاني.'); }
    clients = cRes.clients; checkins = kRes.checkins;
  } catch(err){
    return renderConnectionError(() => renderAdminDashboard(pw));
  }

  const currentWeek = (function(){
    // mirror server ISO-week calc (Mon-based) for "submitted this week" status
    const now = new Date();
    const date = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
    const dayNum = date.getUTCDay() || 7;
    date.setUTCDate(date.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
    const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1)/7);
    return date.getUTCFullYear() + '-W' + (weekNo < 10 ? '0'+weekNo : weekNo);
  })();

  app.innerHTML = '';
  const wrap = el(`<div class="wrap wide"></div>`);

  wrap.appendChild(el(`
    <div class="topbar">
      <div class="brand"><img src="${LOGO_SRC}" alt="PEX"><h3>لوحة المتابعة</h3></div>
      <button class="btn btn-outline btn-sm" id="logout-btn">خروج</button>
    </div>
  `));
  wrap.querySelector('#logout-btn').addEventListener('click', () => { clearAdminPassword(); renderAdminLogin(); });

  // Clients section
  wrap.appendChild(el(`
    <div class="section-title">
      <h2>عملاؤك (${clients.length})</h2>
      <button class="btn btn-sm" id="add-client-btn">+ إضافة عميل</button>
    </div>
  `));

  const grid = el(`<div class="client-grid" style="margin-bottom:32px;"></div>`);
  if (clients.length === 0){
    grid.appendChild(el(`<p>لسه معندكش عملاء. دوس "إضافة عميل" عشان تبدأ.</p>`));
  }
  clients.forEach(c => {
    const clientCheckins = checkins.filter(k => k.token === c.token).sort((a,b)=>a.weekId.localeCompare(b.weekId));
    const latest = clientCheckins[clientCheckins.length-1];
    const prev = clientCheckins[clientCheckins.length-2];
    const hasThisWeek = clientCheckins.some(k => k.weekId === currentWeek);
    let deltaHtml = '';
    if (latest && prev && latest.weight !== '' && prev.weight !== ''){
      const d = (Number(latest.weight) - Number(prev.weight));
      const cls = d <= 0 ? 'delta-down' : 'delta-up';
      const sign = d > 0 ? '+' : '';
      deltaHtml = `<span class="delta ${cls}">${sign}${d.toFixed(1)}</span>`;
    }
    const card = el(`
      <div class="client-card">
        <div class="client-card-head">
          <h3>${c.name}</h3>
          <span class="pill ${hasThisWeek?'pill-done':'pill-pending'}">${hasThisWeek?'سجل الأسبوع ده':'لسه'}</span>
        </div>
        <div class="stat-row">
          <span class="num">${latest ? fmtNum(latest.weight) : '—'}</span>
          <span class="field-hint">كجم</span>
          ${deltaHtml}
        </div>
        <div class="sparkline"></div>
        <div class="client-actions">
          <button class="btn btn-outline btn-sm copy-link-btn" data-token="${c.token}">نسخ اللينك</button>
        </div>
      </div>
    `);
    card.querySelector('.sparkline').appendChild(buildSparkline(clientCheckins.map(k=>Number(k.weight)).filter(n=>!isNaN(n))));
    card.querySelector('.copy-link-btn').addEventListener('click', (e) => copyClientLink(c.token, e.target));
    grid.appendChild(card);
  });
  wrap.appendChild(grid);

  // Checkins log
  wrap.appendChild(el(`<div class="section-title"><h2>سجل المتابعات</h2></div>`));
  const filterRow = el(`<div style="margin-bottom:12px;"><select id="client-filter"><option value="">كل العملاء</option>${clients.map(c=>`<option value="${c.token}">${c.name}</option>`).join('')}</select></div>`);
  wrap.appendChild(filterRow);

  const tableWrap = el(`<div class="table-wrap"><table>
    <thead><tr>
      <th>العميل</th><th>الأسبوع</th><th>الوزن</th><th>النوم</th><th>الطاقة</th><th>الالتزام</th><th>الخطوات</th><th>ملاحظات / مشاكل</th>
    </tr></thead>
    <tbody id="checkins-tbody"></tbody>
  </table></div>`);
  wrap.appendChild(tableWrap);

  function renderRows(filterToken){
    const tbody = tableWrap.querySelector('#checkins-tbody');
    tbody.innerHTML = '';
    const rows = checkins
      .filter(k => !filterToken || k.token === filterToken)
      .sort((a,b) => (b.submittedAt||'').localeCompare(a.submittedAt||''));
    if (rows.length === 0){
      tbody.appendChild(el(`<tr><td colspan="8" style="color:var(--gray-dim);">لا توجد متابعات بعد</td></tr>`));
      return;
    }
    rows.forEach(k => {
      const note = [k.problems, k.notes].filter(Boolean).join(' — ') || '—';
      tbody.appendChild(el(`
        <tr>
          <td>${k.name}</td>
          <td style="direction:ltr;text-align:right;">${k.weekId}</td>
          <td>${fmtNum(k.weight)}</td>
          <td>${fmtNum(k.sleepHours)}</td>
          <td>${fmtNum(k.energy)}/5</td>
          <td>${fmtNum(k.diet)}/5</td>
          <td>${fmtNum(k.steps)}</td>
          <td style="white-space:normal;max-width:260px;">${note}</td>
        </tr>
      `));
    });
  }
  renderRows('');
  filterRow.querySelector('#client-filter').addEventListener('change', (e) => renderRows(e.target.value));

  app.appendChild(wrap);

  // Add client modal
  wrap.querySelector('#add-client-btn').addEventListener('click', () => openAddClientModal(pw, () => renderAdminDashboard(pw)));
}

function buildSparkline(values){
  const W = 100, H = 28;
  if (values.length < 2){
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width','100%'); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    return svg;
  }
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const pad = 4;
  const step = (W - pad*2) / (values.length - 1);
  const pts = values.map((v,i) => {
    const x = pad + i*step;
    const y = H - pad - ((v - min) / range) * (H - pad*2);
    return [x,y];
  });
  const path = pts.map((p,i) => (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('width','100%'); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const baseline = document.createElementNS(svgNS,'line');
  baseline.setAttribute('x1', pad); baseline.setAttribute('x2', W-pad);
  baseline.setAttribute('y1', H-pad); baseline.setAttribute('y2', H-pad);
  baseline.setAttribute('stroke', '#1E2A47'); baseline.setAttribute('stroke-width','1');
  svg.appendChild(baseline);
  const polyline = document.createElementNS(svgNS,'path');
  polyline.setAttribute('d', path);
  polyline.setAttribute('fill','none');
  polyline.setAttribute('stroke','#2FD6C6');
  polyline.setAttribute('stroke-width','2');
  polyline.setAttribute('stroke-linecap','round');
  polyline.setAttribute('stroke-linejoin','round');
  svg.appendChild(polyline);
  const last = pts[pts.length-1];
  const dot = document.createElementNS(svgNS,'circle');
  dot.setAttribute('cx', last[0]); dot.setAttribute('cy', last[1]); dot.setAttribute('r','2.6');
  dot.setAttribute('fill','#378ADD');
  svg.appendChild(dot);
  return svg;
}

async function copyClientLink(token, btn){
  const url = `${location.origin}${location.pathname}?c=${token}`;
  try{
    await navigator.clipboard.writeText(url);
    const original = btn.textContent;
    btn.textContent = 'اتنسخ ✓';
    setTimeout(()=>btn.textContent = original, 1500);
  } catch(err){
    prompt('انسخ اللينك:', url);
  }
}

function openAddClientModal(pw, onDone){
  const backdrop = el(`
    <div class="modal-backdrop">
      <div class="modal stack">
        <h3>إضافة عميل جديد</h3>
        <input type="text" id="new-client-name" placeholder="اسم العميل">
        <div class="error-text" id="new-client-err" hidden></div>
        <div id="new-client-result" hidden></div>
        <div style="display:flex;gap:8px;">
          <button class="btn" id="new-client-save">حفظ</button>
          <button class="btn btn-outline" id="new-client-cancel" style="width:auto;">إلغاء</button>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(backdrop);
  backdrop.querySelector('#new-client-cancel').addEventListener('click', () => { backdrop.remove(); onDone(); });
  backdrop.querySelector('#new-client-save').addEventListener('click', async () => {
    const nameInput = backdrop.querySelector('#new-client-name');
    const errBox = backdrop.querySelector('#new-client-err');
    const resultBox = backdrop.querySelector('#new-client-result');
    const name = nameInput.value.trim();
    if (!name){ errBox.textContent = 'اكتب اسم العميل.'; errBox.hidden = false; return; }
    errBox.hidden = true;
    try{
      const res = await api('addClient', {password: pw, name});
      if (!res.ok) throw res;
      const url = `${location.origin}${location.pathname}?c=${res.token}`;
      nameInput.hidden = true;
      backdrop.querySelector('#new-client-save').hidden = true;
      resultBox.hidden = false;
      resultBox.innerHTML = `
        <p style="margin-bottom:8px;">تم إضافة <b style="color:var(--white);">${name}</b>. ابعتله اللينك ده:</p>
        <div class="copy-box" style="margin-bottom:10px;">${url}</div>
        <button class="btn btn-sm" id="copy-new-link">نسخ اللينك</button>
      `;
      resultBox.querySelector('#copy-new-link').addEventListener('click', async (e) => {
        try{ await navigator.clipboard.writeText(url); e.target.textContent = 'اتنسخ ✓'; }
        catch(err){ prompt('انسخ اللينك:', url); }
      });
      backdrop.querySelector('#new-client-cancel').textContent = 'تم، رجوع للوحة';
    } catch(err){
      errBox.textContent = 'حصل خطأ، جرب تاني.'; errBox.hidden = false;
    }
  });
}

  const token = qs.get('c');
  const isAdmin = qs.get('admin') === '1';
  if (isAdmin) return renderAdminView();
  if (token) return renderClientView(token);
  app.appendChild(el(`
    <div class="wrap center-screen">
      <div class="card stack" style="text-align:center;">
        <img src="${LOGO_SRC}" alt="PEX" style="width:72px;margin:0 auto;">
        <h2>لينك المتابعة الأسبوعية</h2>

      </div>
    </div>
  `));
})();
